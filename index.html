<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시간표 룰렛</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f7f9fc;
            padding: 20px;
        }
        .input-container {
            margin-bottom: 20px;
        }
        input {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 250px;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .roulette-container {
            position: relative;
            margin-top: 20px;
        }
        .arrow {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #ff4757;
            z-index: 10;
        }
        canvas {
            border: 5px solid #333;
            border-radius: 50%;
            background-color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        #spin-btn {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 18px;
            background-color: #ff4757;
            border-radius: 25px;
            font-weight: bold;
        }
        #spin-btn:hover {
            background-color: #e84118;
        }
    </style>
</head>
<body>

<h1>시간표 룰렛</h1>

<p class="subtext" >할 일을 적은 후 룰렛 아래 "spin" 버튼을 누르면 오늘의 할 일이 선택 됩니다.</p>

<!-- 1. 항목 입력 공간 -->
<div class="input-container">
    <input type="text" id="menu-input" placeholder="콤마(,)로 항목을 구분해 주세요 (예: 잠, 놀기)">
    <button onclick="updateRoulette()">적용</button>
</div>

<!-- 2. 화살표와 룰렛 판 -->
<div class="roulette-container">
    <div class="arrow"></div>
    <canvas id="rouletteCanvas" width="350" height="350"></canvas>
</div>

<!-- 3. 회전 버튼 -->
<button id="spin-btn" onclick="spinRoulette()">룰렛 돌리기!</button>



<script type="text/javascript" src="inner_script.js"></script>




</body>
</html>
